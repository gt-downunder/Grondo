name: Bug report
description: Report unexpected behaviour in Grondo.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please complete the sections below.
  - type: input
    id: version
    attributes:
      label: Grondo version
      description: Output of `dotnet list package` or from your csproj (e.g. `1.4.2`).
      placeholder: "1.4.2"
    validations:
      required: true
  - type: input
    id: tfm
    attributes:
      label: Target framework
      description: The target framework your project is built against.
      placeholder: "net10.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: .NET runtime / SDK version
      description: Output of `dotnet --version`.
      placeholder: "10.0.106"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal repro
      description: The smallest code sample that reproduces the problem.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Exception / stack trace (if any)
      render: text
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and this has not been reported
          required: true
        - label: I am using the latest released version of Grondo
          required: true
