name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Mondays 06:00 UTC

permissions:
  contents: read

env:
  DOTNET_SDK_VERSION: 10.0.x
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  stryker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Restore
        run: dotnet restore Grondo.sln

      - name: Install Stryker.NET
        run: dotnet tool install -g dotnet-stryker

      - name: Run Stryker
        run: dotnet stryker --config-file stryker-config.json
        working-directory: tests

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report
          path: tests/StrykerOutput/
          if-no-files-found: ignore

      - name: Write summary
        if: always()
        run: |
          if [ -f tests/StrykerOutput/*/reports/mutation-report.md ]; then
            cat tests/StrykerOutput/*/reports/mutation-report.md >> $GITHUB_STEP_SUMMARY
          fi
